name: MoonReduce CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  MOONBIT_INSTALL_VERSION: '0.10.10+f8a486b6f'
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Resolve dependencies
        shell: pwsh
        run: |
          moon version --all
          moon update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native and pure backends
        shell: pwsh
        run: ./scripts/verify.ps1
